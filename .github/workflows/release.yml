name: Release

on:
  push:
    tags: ["v*"]

env:
  QT_VERSION: "6.8.3"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Package (NSIS installer + portable ZIP)
        run: cpack --config build/CPackConfig.cmake -G "NSIS;ZIP"
        # windeployqt 在 install 阶段由 Packaging.cmake 调用
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Package (DMG)
        run: cpack --config build/CPackConfig.cmake -G "DragNDrop"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Package (deb)
        run: cpack --config build/CPackConfig.cmake -G "DEB"
      - name: Package (AppImage)
        run: packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
